{% extends "base.html" %}

{% block title %}ثبت‌نام{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>ثبت‌نام در ABKAM</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">

        <input
            type="text"
            name="name"
            placeholder="نام نمایشی"
            autocomplete="name"
            required
        >

        <input
            type="text"
            name="username"
            placeholder="آیدی (مثلاً ABKAM_123)"
            autocomplete="username"
            minlength="3"
            maxlength="32"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="رمز عبور"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <input
            type="password"
            name="password_confirm"
            placeholder="تکرار رمز عبور"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit">
            ثبت‌نام
        </button>

    </form>

    <p>
        حساب دارید؟
        <a href="{{ url_for('auth.login') }}">
            وارد شوید
        </a>
    </p>

</div>

{% endblock %}
