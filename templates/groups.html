{% extends "base.html" %}
{% block title %}گروه‌ها{% endblock %}

{% block content %}

<h1>گروه‌ها</h1>

{% for g in groups %}
<a class="list-item" href="/group/{{ g.id }}">

<div class="avatar group-avatar">👥</div>

<div>
<b>{{ g.name }}</b>
<small>{{ g.description }}</small>
</div>

</a>
{% endfor %}

<div class="card">

<h2>ساخت گروه</h2>

<form id="groupForm">

<input name="name" placeholder="نام گروه" required>
<input name="description" placeholder="توضیحات">

<button>ساخت گروه</button>

</form>

</div>

<script>

document.getElementById("groupForm")
.addEventListener("submit", function(e){

e.preventDefault();

fetch("/api/groups", {
method:"POST",
body:new FormData(this)
})
.then(r=>r.json())
.then(result=>{

if(result.ok){
location.href="/group/"+result.id;
}else{
alert(result.error);
}

});

});

</script>

{% endblock %}
